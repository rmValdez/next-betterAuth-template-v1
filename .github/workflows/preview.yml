name: Vercel Preview Deploy

# Manual only (Actions → Vercel Preview Deploy → Run workflow), so pull
# requests stay green until Vercel is set up.
#
# BEFORE THE FIRST RUN — repository settings → Secrets and variables → Actions → Secrets:
#   VERCEL_TOKEN          Vercel access token (required)
#   VERCEL_ORG_ID         from .vercel/project.json after `vercel link` (required)
#   VERCEL_PROJECT_ID     from .vercel/project.json after `vercel link` (required)
#   NEXT_PUBLIC_API_URL   backend URL for previews, e.g. https://api-staging.example.com/api/v1
#   NEXT_PUBLIC_SITE_URL

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to preview'
        required: true
        default: main
      pr_number:
        description: 'Pull request number to comment the preview URL on (optional)'
        required: false

jobs:
  preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          MISSING=""
          [ -n "$VERCEL_TOKEN" ] || MISSING="$MISSING VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || MISSING="$MISSING VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || MISSING="$MISSING VERCEL_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:$MISSING — see the header of preview.yml"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Deploy to Vercel (Preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          npm install -g vercel
          DEPLOY_URL=$(vercel --token "$VERCEL_TOKEN" --yes \
            --build-env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-env NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-env NEXT_PUBLIC_APP_ENV=staging)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const sha = (await github.rest.repos.getCommit({
              owner: context.repo.owner, repo: context.repo.repo, ref: '${{ inputs.ref }}',
            })).data.sha;
            await github.rest.issues.createComment({
              issue_number: Number('${{ inputs.pr_number }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Vercel Preview Deploy\n\n**Preview URL:** ${{ steps.deploy.outputs.url }}\n\nDeployed from \`${sha.slice(0, 7)}\``,
            });
