name: Deploy to ECR

# Manual only (Actions → Deploy to ECR → Run workflow), like mapanytime's
# deploys: nothing ships on push, and an unconfigured project doesn't turn
# every merge red.
#
# BEFORE THE FIRST RUN — repository settings → Secrets and variables → Actions:
#   Variables:
#     AWS_DEPLOY_ROLE_ARN  IAM role trusted for GitHub OIDC (required)
#     AWS_REGION           default: ap-southeast-1
#     ECR_REPOSITORY       default: next-betterauth-template
#   Secrets (baked into the build — NEXT_PUBLIC_* are public by design):
#     NEXT_PUBLIC_API_URL  e.g. https://api.example.com/api/v1 (required)
#     NEXT_PUBLIC_SITE_URL e.g. https://app.example.com

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: main

concurrency:
  group: deploy-ecr
  cancel-in-progress: false

permissions:
  id-token: write # OIDC — no static AWS keys in GitHub
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'next-betterauth-template' }}

    steps:
      - name: Check deploy configuration
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          MISSING=""
          [ -n "$ROLE" ] || MISSING="$MISSING AWS_DEPLOY_ROLE_ARN(variable)"
          [ -n "$API_URL" ] || MISSING="$MISSING NEXT_PUBLIC_API_URL(secret)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository configuration:$MISSING — see the header of deploy-ecr.yml"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image tag
        id: tag
        # The checked-out commit, not github.sha (the commit the dispatch came
        # from) — otherwise the tag can name code that isn't in the image.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
